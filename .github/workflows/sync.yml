name: Auto Sync from AcgDev SVN

on:
  schedule:
    # 每天 UTC 18:00 (北京时间凌晨 02:00) 自动同步一次
    - cron: '0 18 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动点击按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Sync from SVN
        run: |
          # 临时导出 SVN 最新数据
          mkdir -p /tmp/svn_export
          # 信任自签证书、非交互登录
          svn export --force \
            --username "test" \
            --password "" \
            --no-auth-cache \
            --non-interactive \
            --trust-server-cert-failures=unknown-ca,cn-mismatch,expired,not-yet-valid,other \
            "https://svn.acgdev.com:505/svn/eushully_editor/trunk" /tmp/svn_export

          # 同步文件到当前 git 仓库（排除 .git）
          rsync -av --delete --exclude='.git' --exclude='.github' /tmp/svn_export/ ./

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有内容变动
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto sync from AcgDev SVN: $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
            echo "Changes pushed successfully."
          else
            echo "No changes detected."
          fi
